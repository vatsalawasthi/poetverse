spring.application.name=poetverse-backend
server.port=8080

# MongoDB Configuration
# Supports local MongoDB or cloud MongoDB Atlas via URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/poetverse}
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.com.poetverse=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
